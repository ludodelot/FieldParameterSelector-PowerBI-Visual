name: Release horizontal visual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create horizontal-v1.0.0.0 \
            releases/horizontal-v1.0.0.0/*.pbiviz \
            --target "$GITHUB_SHA" \
            --title "Ordered FP Selector (Horizontal) v1.0.0.0" \
            --notes-file releases/horizontal-v1.0.0.0/RELEASE_NOTES.md
